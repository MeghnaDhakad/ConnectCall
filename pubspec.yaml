name: connect_call
description: A functional 1-to-1 calling application built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  cloud_firestore: ^4.13.0
  firebase_messaging: ^14.6.0
  firebase_storage: ^11.2.0

  # Calling - Using Agora
  agora_rtc_engine: ^6.2.0
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.1

  # Permission Handling - Fixed version
  permission_handler: ^11.0.0

  # UI/UX
  cached_network_image: ^3.3.0

  # Image & Media
  image_picker: ^1.0.4
  uuid: ^4.0.0

  # Utilities
  intl: ^0.19.0
  logger: ^2.1.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
